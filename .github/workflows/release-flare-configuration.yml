name: Release Flare Configuration

on:
  push:
    tags:
      - 'release/flare-configuration/*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (x.y.z)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    environment: nuget-publish
    steps:
      - run: echo "Approved"
  publish:
    needs: gate
    uses: flrapp/.github/.github/workflows/nuget-publish.yml@main
    with:
      project-path: ./src/Flare.Extensions.Configuration/Flare.Extensions.Configuration.csproj
      version: ${{ inputs.version }}
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
